name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
    # Keep the proof-bearing job on 22.04 so Bubblewrap enforces the sandbox
    # without disabling a host security control on the runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8
      - name: Restore pinned Isabelle archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raes-sdl/tooling/archives/Isabelle2025-2_linux.tar.gz
          key: isabelle-linux-x86-64-2025-2-a20a507bc7c1270d
      - name: Install proof sandbox
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y bubblewrap
          fi
      - name: Acquire pinned Isabelle distribution
        run: uv run --project implementations/python --frozen python -m tools.isabelle_tool acquire
      - name: Resolve policy base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_rev=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_rev=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve requirement UID from branch
        id: requirement
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          REQ_UID="$(printf '%s\n' "$BRANCH" | grep -oE '[A-Z]{3}-[0-9]{3}' | head -n1 || true)"
          echo "Resolved branch='$BRANCH' uid='$REQ_UID'"
          echo "uid=$REQ_UID" >> "$GITHUB_OUTPUT"
      - name: Run canonical verification graph
        env:
          RAES_REQUIREMENT_UID: ${{ steps.requirement.outputs.uid }}
          GC_BASE_URL: ${{ vars.GC_BASE_URL }}
        run: |
          verify_args=(--base-rev "${{ steps.base.outputs.base_rev }}")
          if [ -n "${{ steps.requirement.outputs.uid }}" ]; then
            verify_args+=(--requirement-uid "${{ steps.requirement.outputs.uid }}")
          else
            verify_args+=(--skip-requirement)
          fi
          uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s verify -- "${verify_args[@]}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: implementations/python/coverage.xml

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8
      - name: Run fuzz session
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s fuzz

  # Every interpreter `requires-python` admits and the trove classifiers
  # advertise. `verify` stays single-version because it owns the coverage
  # artifact Sonar consumes and the Isabelle replay, neither of which varies by
  # interpreter; this job carries the compatibility signal on the hermetic suite
  # alone, so a release cannot advertise a version nothing exercises.
  interpreters:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8
      - name: Run unit suite
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s tests

  # Opt-in, non-blocking, runtime-gated container integration tests (RUN-314).
  # Kept out of the hermetic `verify` graph; the `docker` marker tests self-skip
  # when no runtime is present, and this whole job never fails the build.
  integration-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8
      - name: Probe for a container runtime
        id: runtime
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No container runtime available; skipping docker integration session."
          fi
      - name: Run docker integration session
        if: steps.runtime.outputs.available == 'true'
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s integration_docker

  # Advisory OSV-scanner sweep over the Python dependency lockfile (issue #34).
  # Non-gating: CVE findings surface as an uploaded JSON artifact and never fail
  # the build. The `osv_scan` nox session is kept out of the hermetic `verify`
  # graph; genuine scanner/setup failures still fail this job's step (visible as
  # a soft failure) so the advisory posture never hides a broken scan.
  supply-chain:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8
      - name: Run OSV-scanner (advisory)
        run: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s osv_scan
      - name: Upload OSV-scanner report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-report
          path: implementations/python/osv-scanner-report.json
          if-no-files-found: warn

  sonar:
    runs-on: ubuntu-latest
    needs: [verify]
    # SonarCloud needs SONAR_TOKEN, which GitHub withholds from both forked-PR
    # runs and Dependabot-triggered runs (Actions secrets are unavailable in
    # those contexts). Skip cleanly there so the required check reports
    # "skipped" (treated as passing by branch protection) instead of a spurious
    # "Not authorized" auth failure.
    if: >-
      (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: implementations/python/
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
