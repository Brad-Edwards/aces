name: Release

# Conventional-commit-driven release (ADR 0006 blueprint from aces-scenario-packs;
# tracked for aces in #684). Builds on #537 (the corpus-bundled wheel).
#
# On every push to `main`, python-semantic-release (PSR) inspects the Conventional
# Commit messages since the last tag, computes the next SemVer, and creates the
# tag + GitHub Release (notes generated from the commits). It is TAG-ONLY
# (`commit = false` in pyproject) — it never pushes a commit back to the
# branch-protected `main`. The version itself is DERIVED from that tag by
# hatch-vcs at build time; there is no version string to edit.
#
# When PSR reports a release, the job then builds the corpus-bundled wheel + sdist
# with `uv build`, RE-VERIFIES the corpus payload is present (the #537 guarantee),
# attaches a CycloneDX SBOM + the distributions to the GitHub Release, and
# publishes to PyPI via OIDC trusted publishing (no stored token).
#
# Trust model: the trigger is a push to the protected, already-reviewed `main`
# branch, so the repository-controlled build hook (hatch_build.py) only ever runs
# on reviewed code. `workflow_dispatch` bootstraps the first release and is the
# manual override; the job is guarded to `main` so a dispatch from another ref
# cannot publish.
#
# See docs/explain/releasing.md for the full runbook and the one-time PyPI
# trusted-publisher setup.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force a bump when no releasable commits exist (patch|minor|major)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publish only from the protected default branch. `push` is already
    # main-only; this also blocks a workflow_dispatch from an unreviewed ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # PSR creates the release tag + the GitHub Release
      id-token: write   # OIDC trusted publishing to PyPI (no stored token)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Python Semantic Release (compute version + tag + GitHub Release)
        id: release
        uses: python-semantic-release/python-semantic-release@37a30a7987cfebb6d49240bf1c4e9cd9817d0673 # v10.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: implementations/python
          build: false
          force: ${{ github.event.inputs.force }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        if: steps.release.outputs.released == 'true'
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.release.outputs.released == 'true'
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8

      - name: Build the corpus-bundled wheel + sdist from the release tag
        if: steps.release.outputs.released == 'true'
        run: uv build --out-dir dist implementations/python

      - name: Verify the contract corpus is bundled in the wheel (#537)
        if: steps.release.outputs.released == 'true'
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/aces_sdl-*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel, found {wheels}")
          names = zipfile.ZipFile(wheels[0]).namelist()
          required = [
              "aces_contracts/_corpus/profiles/backend/provisioning-only.json",
              "aces_contracts/_corpus/fixtures/",
              "aces_contracts/_corpus/concept-authority/controlled-vocabularies-v1.json",
              "aces_contracts/_corpus/schemas/",
          ]
          missing = [r for r in required if not any(n == r or n.startswith(r) for n in names)]
          if missing:
              sys.exit(f"wheel is missing corpus payload: {missing}")
          print(f"corpus payload present: {sum(n.startswith('aces_contracts/_corpus/') for n in names)} files")
          PY

      - name: Generate CycloneDX SBOM
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl cyclonedx-bom
          mkdir -p sbom
          cyclonedx-py environment \
            --output-format JSON \
            --output-file sbom/aces-sdl.cdx.json

      - name: Attach the SBOM + distributions to the GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${TAG}" dist/* sbom/aces-sdl.cdx.json --clobber

      - name: Publish to PyPI (OIDC trusted publishing)
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
