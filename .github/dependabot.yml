# Dependabot keeps the SHA-pinned GitHub Actions (and Python deps) patched, so
# the pins in .github/workflows/*.yml do not silently rot (#684 release hardening).
#
# All updates target `dev` (not the default `main`): bumps should flow through the
# integration branch and the normal dev->main promotion, not land on `main` where
# a release is being cut. NOTE: dependabot reads this file from the DEFAULT branch
# (`main`), so `target-branch` only takes effect once this change is on `main`.
version: 2
updates:
  # GitHub Actions used across all workflows (release.yml pins are publishing-
  # critical: they run in a job with id-token: write). Grouped so a batch of pin
  # bumps arrives as one reviewable PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Python package dependencies for the raes distribution.
  - package-ecosystem: "pip"
    directory: "/implementations/python"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # z3-solver is pinned by a governed contract, not by ordinary dependency
      # policy: the aces-z3-finite-domain/v1 profile fixes package_version
      # 4.16.0.0 / engine_version 4.16.0 in SolverConfigurationModel, in the
      # published scenario-satisfiability-evidence-v1 schema, and in its
      # fixtures, so satisfiability evidence stays reproducible.
      #
      # An automated bump rewrites pyproject away from that authority while
      # `uv --frozen` keeps resolving the locked 4.16.0.0, so CI stays green and
      # the contradiction is invisible until someone regenerates the lock and
      # the formal semantic-validation gate breaks. That has happened twice
      # (#856, #872). Re-pinning the governed profile is a deliberate change
      # with evidence to regenerate; it is not Dependabot's call.
      - dependency-name: "z3-solver"
