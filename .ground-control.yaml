schema_version: 1
# Ground Control still owns the pre-cutover project identifier. ADR-096
# requires external provisioning before this binding can move.
project: aces-sdl
github_repo: RAESystem/rae
workflow:
  test_command: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s verify
  completion_command: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s verify
  lint_command: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s lint
  format_command: uv tool run --from 'nox[uv]==2026.4.10' nox -f noxfile.py -s hygiene
  codex_review:
    pre_push_cap: 1
  test_quality_review:
    pre_push_cap: 1
  review_disposition:
    enabled: false
    mode: shadow
    max_auto_overrides: 0
    judge:
      enabled: false
docs:
  adr_dir: docs/decisions/adrs/
example_paths:
  source: implementations/python/packages/
  test: implementations/python/tests/
requirements:
  uid_examples:
    - GOV-918
    - RUN-311
    - ADR-012
routing:
  enabled: true
  default_provider: claude
  stages: {}
sonarcloud:
  project_key: Brad-Edwards_raes
  organization: brad-edwards
rules:
  plan_rules: .gc/plan-rules.md
