extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  '\bin order to\b': to
  '\bprior to\b': before
  '\bsubsequent to\b': after
  '\butili[sz]e\b': use
  '\butili[sz]es\b': uses
  '\butili[sz]ing\b': using
  '\bfacilitate\b': help
  '\bleverage\b': use
  '\bcommence\b': start
  '\bterminate\b': stop
