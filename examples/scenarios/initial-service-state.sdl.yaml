name: initial-service-state
description: Provider-neutral initial content materialized through a named service.

nodes:
  mail:
    type: vm
    os: linux
    resources:
      ram: 2 gib
      cpu: 2
    services:
      - name: imap
        port: 143

content:
  company-mail:
    type: dataset
    target: mail
    format: message-set-v1
    items:
      - name: welcome-message
        display_name: Welcome to the company
    service_materialization:
      target_service_ref: nodes.mail.services.imap
      interface_profile: service-content
      profile_version: "1"
      requirements:
        operation: ensure-owned-items
        conflict_policy: reject-unowned-collision
        readback: canonical-content-digest
      readback_assertion_refs: [company-mail-visible]
      evidence_requirement_refs: [company-mail-readback]
      observation_boundary_refs: [participant-mail-view]

propositions:
  company-mail-visible:
    description: The authored message set is visible through the named service.
    subjects: [content.company-mail]
    basis: observed_state
    predicate:
      kind: boolean
      property: service-content-visible
      semantic_ref: urn:raes:observable:service-content-visible
      expected: true
    evidence_requirements: [company-mail-readback]

assertions:
  company-mail-visible:
    proposition: company-mail-visible
    role: postcondition

observation_boundaries:
  participant-mail-view:
    projection_basis: ordinary participant access to the named mail service
    observable_refs: [content.company-mail]
    redaction_policy: preserve participant-visible message fields
    latency_profile: available before participant admission

evidence_requirements:
  company-mail-readback:
    source_refs: [content.company-mail]
    scope: native service readback
    boundary_kind: participant_equivalent
    channel: api_response
    artifact_role: service_materialization_readback
    media_types: [application/json]
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
