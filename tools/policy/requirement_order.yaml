project: aces-sdl

phases:
  - id: gov-concept-authority
    requirements:
      - GOV-917
      - GOV-918
      - GOV-919
      - GOV-920
      - GOV-921
      - GOV-922
  - id: sdl-language
    patterns:
      - ^DSL-
  - id: api400-core
    requirements:
      - API-412
      - API-413
    blocked_until:
      - gov-concept-authority
  - id: runtime-core
    requirements:
      - RUN-300
      - RUN-311
    blocked_until:
      - api400-core
  - id: reference-implementations
    requirements:
      - RUN-313
      - RUN-314
      - RUN-315
    blocked_until:
      - runtime-core
  - id: semantics-expansion
    patterns:
      - ^SEM-
    blocked_until:
      - reference-implementations
  - id: api400-deferred
    requirements:
      - API-405
      - API-406
      - API-407
      - API-408
      - API-409
      - API-410
      - API-411
      - API-414
      - API-415
      - API-416
      - API-417
      - API-418
      - API-419
      - API-420
      - API-421
    blocked_until:
      - semantics-expansion
    manual_release: true
  - id: documentation-surfaces
    requirements:
      - AUT-805
      - AUT-807
      - AUT-809
      - ASR-516
    blocked_until:
      - gov-concept-authority
  - id: modularity-initiative
    requirements:
      - MOD-001
  - id: experiment-core
    requirements:
      - EXP-701
      - EXP-702
      - EXP-703
      - EXP-704
      - EXP-705
  - id: decision-record-governance
    requirements:
      - GOV-941

