policy_version: 1

legacy_top_level_roots:
  - conformance
  - schemas
  - src

source_roots:
  - implementations/python/packages
  - implementations/python/src

# ADR-009 section 7: published schemas under contracts/schemas/ are
# hand-governed normative authority. A schema change must record a
# contract-facing change-ledger entry in the publication manifest (the deeper
# rationale/hash check lives in tools/check_schema_publication.py --base-rev).
generated_contracts:
  generated_roots:
    - contracts/schemas
  manifest_path: contracts/schema-publication-manifest.json

compatibility_layer:
  root: implementations/python/src/aces
  owning_root: implementations/python/packages
  forbidden_import_prefixes:
    - aces.

concept_authority:
  reserved_path_tokens:
    - concept-authority
    - concept-families-v1
  allowed_paths:
    - specs/concept-authority
    - contracts/concept-authority
    - contracts/schemas/concept-authority
    - contracts/fixtures/concept-authority
    - docs/explain/reference/shared-concept-model.md
    - docs/decisions/adrs/adr-012-shared-concept-authority-and-aces-extension-discipline.md
    - docs/decisions/adrs/adr-062-concept-authority-catalog-governance-gate.md
    - implementations/python/tests/test_concept_authority.py
    - implementations/python/packages/aces_contracts
    - implementations/python/packages/aces_backend_protocols
    - implementations/python/packages/aces_processor
    - notes/reconstructed-work-order-after-gov-917.md

adr_index:
  index_path: docs/decisions/adrs/README.md
  adr_glob: docs/decisions/adrs/adr-*.md

# ADR-015: SDL is the lower layer; aces_sdl must not import aces_processor.
layering_rules:
  - id: aces_sdl_no_aces_processor
    scope_root: implementations/python/packages/aces_sdl
    forbidden_top_level: aces_processor

# ADR-036 / MOD-001: explicit module ownership boundaries.
module_boundaries:
  adr: ADR-036
  package_coverage_roots:
    - implementations/python/packages
  modules:
    - id: aces_sdl
      root: implementations/python/packages/aces_sdl
      allowed_top_level_imports:
        - aces_contracts
      forbidden_import_prefixes:
        - aces_processor
        - aces_runtime
        - aces_backend_protocols
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
    - id: aces_processor
      root: implementations/python/packages/aces_processor
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_contracts
        - aces_sdl
      forbidden_import_prefixes:
        - aces_runtime
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
    - id: aces_runtime
      root: implementations/python/packages/aces_runtime
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_contracts
        - aces_processor
      forbidden_import_prefixes:
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
      public_import_prefixes:
        aces_processor:
          - aces_processor.compiler
          - aces_processor.models
          - aces_processor.planner
    - id: aces_backend_protocols
      root: implementations/python/packages/aces_backend_protocols
      allowed_top_level_imports:
        - aces_contracts
    - id: aces_backend_stubs
      root: implementations/python/packages/aces_backend_stubs
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_contracts
        - aces_runtime
      public_import_prefixes:
        aces_runtime:
          - aces_runtime.registry
    - id: aces_reference_backend
      root: implementations/python/packages/aces_reference_backend
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_contracts
        - aces_runtime
      forbidden_import_prefixes:
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
        - aces_processor
        - aces_sdl
      public_import_prefixes:
        aces_runtime:
          - aces_runtime.registry
    - id: aces_backend_libvirt
      root: implementations/python/packages/aces_backend_libvirt
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_contracts
        - aces_runtime
      forbidden_import_prefixes:
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
        - aces_processor
        - aces_reference_backend
        - aces_sdl
      public_import_prefixes:
        aces_runtime:
          - aces_runtime.registry
    - id: aces_operations
      root: implementations/python/packages/aces_operations
      allowed_top_level_imports:
        - aces_backend_libvirt
        # Pure, side-effect-free manifest/capability renderers only (see
        # public_import_prefixes below). aces_operations embeds the canonical
        # BackendManifestV2 payload + capability-gap report in the libvirt
        # scenario-evidence artifact instead of a hand-rolled summary, so the
        # evidence carries the same backend contract the rest of the stack uses.
        - aces_backend_protocols
        - aces_contracts
        - aces_runtime
        - aces_sdl
      forbidden_import_prefixes:
        - aces_backend_stubs
        - aces_cli
        - aces_conformance
        - aces_mcp
        - aces_processor
        - aces_reference_backend
      public_import_prefixes:
        aces_backend_libvirt:
          - aces_backend_libvirt.target
          - aces_backend_libvirt.techvault_native
          - aces_backend_libvirt.guest_certified_driver
        aces_backend_protocols:
          - aces_backend_protocols.manifest
          - aces_backend_protocols.capabilities
        aces_runtime:
          - aces_runtime.control_plane
          - aces_runtime.manager
          - aces_runtime.registry
        aces_sdl:
          - aces_sdl.parser
    - id: aces_conformance
      root: implementations/python/packages/aces_conformance
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_cli
        - aces_contracts
        - aces_processor
        - aces_runtime
        - aces_sdl
      public_import_prefixes:
        aces_processor:
          - aces_processor.compiler
          - aces_processor.models
          - aces_processor.planner
          - aces_processor.reference
        aces_runtime:
          - aces_runtime.control_plane
          - aces_runtime.registry
          - aces_runtime.result_contracts
    - id: aces_cli
      root: implementations/python/packages/aces_cli
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_backend_stubs
        - aces_contracts
        - aces_conformance
        - aces_operations
        - aces_processor
        - aces_sdl
      forbidden_import_prefixes:
        - aces_runtime
      public_import_prefixes:
        # Plan-inspection CLI (issue #609): the backend-manifest-v2 adapter and
        # the pure stub-manifest declaration seam only -- never the stub runtime
        # components (aces_backend_stubs.stubs pulls aces_runtime).
        aces_backend_protocols:
          - aces_backend_protocols.manifest
        aces_backend_stubs:
          - aces_backend_stubs.manifest
        aces_operations:
          - aces_operations.libvirt_evidence_run
          - aces_operations.cross_backend_corpus
          - aces_operations.techvault_live
        aces_processor:
          - aces_processor.manifest
          - aces_processor.models
          - aces_processor.reference
    - id: aces_mcp
      root: implementations/python/packages/aces_mcp
      allowed_top_level_imports:
        - aces_backend_protocols
        - aces_backend_stubs
        - aces_contracts
        - aces_processor
        - aces_sdl
      forbidden_import_prefixes:
        - aces_runtime
      public_import_prefixes:
        aces_processor:
          - aces_processor.compiler
          - aces_processor.manifest
          - aces_processor.models
          - aces_processor.planner
    - id: aces_contracts
      root: implementations/python/packages/aces_contracts
      allowed_top_level_imports:
        - aces_sdl

# ADR-015: non-test source files under packages/ cap at 500 lines (aligned
# with SonarCloud S104; lowered from 600 per the 2026-07-12 amendment / #561).
# The allowlist (oversized_allowlist.yaml) lists the files that were over the
# cap when the current cap was adopted; each split PR removes its entry. The
# allowlist must stay a subset of the *code* constant
# _ADR015_INITIAL_OVERSIZED_FILES in tools/policy/repo_policy.py (the fixed
# reference set) — entries can be drained but not added. The locked set is
# intentionally NOT mirrored here: keeping it as config the same PR can edit
# would make the "shrink only" rule self-satisfiable.
oversized_source_files:
  line_cap: 500
  allowlist_path: tools/policy/oversized_allowlist.yaml
  scope_roots:
    - implementations/python/packages
  excluded_path_prefixes:
    - implementations/python/tests
  file_extensions:
    - .py
