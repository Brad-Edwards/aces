[tool.towncrier]
name = "aces-sdl"
filename = "CHANGELOG.md"
directory = "changelog.d"
template = "changelog.d/_template.md.jinja"
title_format = false
start_string = "<!-- towncrier release notes start -->\n"
issue_format = "(#{issue})"
wrap = false
all_bullets = true

# Fragment type -> SemVer bump (see tools/compute_release.py, the single source
# of truth for the release version):
#   breaking, removed -> MAJOR   (breaking API change / removal)
#   added, changed, deprecated -> MINOR
#   security, fixed -> PATCH
# `breaking` is the explicit major signal; use it for any backward-incompatible
# change that is not itself a `removed`.
[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
