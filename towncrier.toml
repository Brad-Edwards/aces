[tool.towncrier]
name = "aces-sdl"
filename = "CHANGELOG.md"
directory = "changelog.d"
template = "changelog.d/_template.md.jinja"
title_format = false
start_string = "<!-- towncrier release notes start -->\n"
issue_format = "(#{issue})"
wrap = false
all_bullets = true

# Fragment type -> release bump is computed by tools/release.py:
#   removed  -> major (only once already >= 1.0; pre-1.0 it is a minor)
#   added / changed / deprecated -> minor
#   security / fixed -> patch
# `breaking` renders a Breaking Changes section but does NOT auto-escalate the
# bump — it is inert until you force the major explicitly (release.py --version
# 1.0.0). It is kept so breaking changes are recorded in the changelog now.
[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
